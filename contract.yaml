openapi: 3.1.0
info:
  title: Shortener
  description: Application qui permet de raccourcir ses liens
  version: 1.0.0
servers:
  - url: http://localhost:8000
paths:
  /shorten:
    post:
      description: Raccourcir un lien
      operationId: createEncodedUrl
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortenRequest"
      responses:
        "201":
          description: Création / lecture dans la bdd avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortenedUrl"
  /shortened:
    get:
      description: Récupérer la liste des url raccourcies
      operationId: listShortenedUrls
      responses:
        "200":
          description: Récupération avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortenedUrls"
  /shortened/{encodedUrl}:
    get:
      summary: Rediriger vers l'URL d'origine
      description: Redirige vers l'URL d'origine associée au code encodé.
      operationId: redirectToUrl
      parameters:
        - name: encodedUrl
          in: path
          required: true
          description: Code encodé du lien raccourci
          schema:
            type: string
      responses:
        "307":
          description: Redirection temporaire vers l'URL d'origine
          headers:
            Location:
              description: URL de destination
              schema:
                type: string
                format: uri
          content: { }
        "404":
          description: Code encodé introuvable
          content: { }
components:
  schemas:
    ShortenRequest:
      type: object
      description: Données envoyées pour raccourcir un lien
      required: url
      properties:
        url:
          type: string
          format: uri
          description: L'url que l'on veut raccourcir
    ShortenedUrl:
      type: objet
      description: Représentation d'un lien raccourci
      properties:
        id:
          type: integer
          format: long
          description: Id dans la bdd
        url:
          type: string
          description: L'url cible
        encodedUrl:
          type: string
          description: Le code raccourci
    ShortenedUrls:
      type: array
      description: Liste d'url raccourcies
      items:
        $ref: "#/components/schemas/ShortenedUrl"
